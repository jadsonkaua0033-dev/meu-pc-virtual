name: Meu PC Virtual

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar XFCE e VNC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server

      - name: Configurar VNC
        run: |
          mkdir -p "$HOME/.vnc"

          printf '123456\n123456\nn\n' | vncpasswd "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      - name: Iniciar VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes \
            -SecurityTypes VncAuth

          echo "VNC iniciado com sucesso!"
          vncserver -list

      - name: Manter o ambiente ativo
        run: |
          echo "PC virtual funcionando..."
          sleep 300
