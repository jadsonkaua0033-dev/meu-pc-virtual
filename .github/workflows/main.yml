name: Meu PC Virtual

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar ambiente gráfico
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server

      - name: Configurar VNC
        run: |
          mkdir -p ~/.vnc

          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

      - name: Iniciar ambiente gráfico
        run: |
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes
          echo "===================================="
          echo "PC VIRTUAL INICIADO"
          echo "Desktop: XFCE"
          echo "Resolução: 1280x720"
          echo "VNC: ativo"
          echo "===================================="

      - name: Manter sessão durante o job
        run: |
          echo "O PC virtual está funcionando."
          sleep 300
