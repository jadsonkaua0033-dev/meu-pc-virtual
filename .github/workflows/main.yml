name: Meu PC Virtual

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar ambiente gráfico
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies \
            tigervnc-standalone-server \
            novnc websockify \
            curl wget

      - name: Configurar VNC
        run: |
          mkdir -p "$HOME/.vnc"

          printf '123456\n123456\nn\n' | vncpasswd "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      - name: Iniciar VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes \
            -SecurityTypes VncAuth

          echo "VNC iniciado!"

      - name: Iniciar noVNC
        run: |
          websockify \
            --web=/usr/share/novnc/ \
            8080 \
            localhost:5901 > /tmp/novnc.log 2>&1 &

          sleep 5

          echo "noVNC iniciado!"

      - name: Instalar Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

      - name: Criar link público
        run: |
          ./cloudflared tunnel --url http://localhost:8080 2>&1 | tee /tmp/cloudflare.log &
          
          sleep 10

          echo ""
          echo "=========================================="
          echo "       LINK DO SEU PC VIRTUAL"
          echo "=========================================="
          
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflare.log || true
          
          echo "=========================================="
          echo "Senha do VNC: 123456"
          echo "=========================================="

      - name: Manter PC virtual funcionando
        run: |
          echo "PC VIRTUAL ONLINE!"
          echo "O link acima pode ser aberto no navegador."
          sleep 20000
